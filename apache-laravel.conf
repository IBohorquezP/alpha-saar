<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public # Apunta al directorio public de Laravel

    <Directory /var/www/html/public>
        Options Indexes FollowSymLinks
        AllowOverride All # Habilita la lectura de archivos .htaccess
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>